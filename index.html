
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AffiliateHub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

  body {
    background: #0a0e27;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(56,189,248,0.2), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(168,85,247,0.2), transparent 40%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  /* Animated Blobs */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.4; z-index: -1;
    animation: float 12s ease-in-out infinite;
  }
  .blob1 { width:300px; height:300px; background:#38bdf8; top:-50px; left:-50px; }
  .blob2 { width:400px; height:400px; background:#a855f7; bottom:-100px; right:-100px; animation-delay:3s; }

  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px,-40px) scale(1.1); }
  }

  .login-box {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(56,189,248,0.2);
    padding: 40px 30px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    animation: fadeUp 0.8s ease;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(30px); }
    to { opacity:1; transform: translateY(0); }
  }

  .logo {
    text-align: center;
    font-size: 26px; font-weight: 700;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 30px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
    padding: 5px;
    margin-bottom: 25px;
  }
  .tabs button {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.3s;
    font-size: 14px;
  }
  .tabs button.active {
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    color: #fff;
    box-shadow: 0 5px 15px rgba(56,189,248,0.4);
  }

  /* Form */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 13px; color: #cbd5e1;
    margin-bottom: 6px; font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 13px 15px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    transition: all 0.3s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 15px rgba(56,189,248,0.3);
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(56,189,248,0.5);
  }
  .btn:active { transform: translateY(0); }

  .msg {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
    min-height: 20px;
  }
  .error { color: #ef4444; }
  .success { color: #22c55e; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="login-box">

  <div class="logo">⚡ AffiliateHub</div>
  <div class="subtitle">Welcome! Please login to continue</div>

  <!-- Tabs -->
  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">Login</button>
    <button id="signupTab" onclick="showSignup()">Sign Up</button>
  </div>

  <!-- LOGIN FORM -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Login 🚀</button>
    <div class="msg" id="loginMsg"></div>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Ali Khan" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Min 6 characters" minlength="6" required>
    </div>
    <button type="submit" class="btn">Create Account ✨</button>
    <div class="msg" id="signupMsg"></div>
  </form>

</div>

<script>
  // Page load pe check: agar user pehle se login hai to dashboard pe bhej do
  window.onload = () => {
    if (localStorage.getItem("loggedInUser")) {
      window.location.href = "dashboard.html";
    }
  };

  // Tab switching
  function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");
  }
  function showSignup() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("signupTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");
  }

  // SIGNUP
  function handleSignup(e) {
    e.preventDefault();
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim().toLowerCase();
    const password = document.getElementById("signupPassword").value;
    const msg = document.getElementById("signupMsg");

    // Purane users nikalo
    let users = JSON.parse(localStorage.getItem("users") || "[]");

    // Check: email pehle se hai?
    if (users.find(u => u.email === email)) {
      msg.className = "msg error";
      msg.textContent = "❌ Ye email pehle se registered hai. Login karo.";
      return;
    }

    // Naya user save karo
    users.push({ name, email, password });
    localStorage.setItem("users", JSON.stringify(users));

    msg.className = "msg success";
    msg.textContent = "✅ Account ban gaya! Ab login karo.";

    // 1.5 sec baad login tab pe le jao
    setTimeout(() => {
      showLogin();
      document.getElementById("loginEmail").value = email;
      document.getElementById("loginPassword").value = "";
      document.getElementById("signupMsg").textContent = "";
    }, 1500);
  }

  // LOGIN
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const msg = document.getElementById("loginMsg");

    let users = JSON.parse(localStorage.getItem("users") || "[]");
    const user = users.find(u => u.email === email && u.password === password);

    if (!user) {
      msg.className = "msg error";
      msg.textContent = "❌ Email ya password galat hai.";
      return;
    }

    // Login successful
    localStorage.setItem("loggedInUser", JSON.stringify({
      name: user.name,
      email: user.email
    }));

    msg.className = "msg success";
    msg.textContent = "✅ Login successful! Redirecting...";

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 800);
  }
</script>

</body>
</html>
