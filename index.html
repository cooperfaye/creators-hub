
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creators Hub - Link Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #7b2cbf; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #5a189a; }
        .result { margin-top: 15px; word-break: break-all; background: #e0aaff; padding: 10px; border-radius: 5px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Creators Hub</h2>
    <input type="text" id="longUrl" placeholder="अपना लंबा लिंक यहाँ डालें...">
    <button onclick="generateLink()">लिंक बनाएँ (Generate)</button>
    <div class="result" id="resultBox"></div>
</div>

<script>
    function generateLink() {
        let url = document.getElementById('longUrl').value;
        let resultBox = document.getElementById('resultBox');
        if(url) {
            let uniqueId = Math.random().toString(36).substring(2, 8);
            let shortLink = window.location.origin + "/#" + uniqueId;
            resultBox.style.display = "block";
            resultBox.innerHTML = `आपका शॉर्ट लिंक तैयार है:<br><a href="${url}" target="_blank">${shortLink}</a>`;
        } else {
            alert("कृपया पहले सही लिंक दर्ज करें!");
        }
    }
</script>

</body>
</html>
