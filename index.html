
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creators Hub - Affiliate Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #ff6600; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #e55b00; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="auth-container">
        <h2>🚀 Creators Hub</h2>
        <h3>Login / Register</h3>
        <input type="email" id="email" placeholder="Enter your email">
        <input type="password" id="password" placeholder="Enter your password">
        <button id="signup-btn">Sign Up</button>
        <button id="login-btn" style="background-color: #333;">Log In</button>
    </div>

    <div class="container hidden" id="dashboard-container">
        <h2>🎉 Welcome to Dashboard</h2>
        <p>Your affiliate tools and links are ready below:</p>
        <div id="result-box">
            <p><strong>Affiliate Ref Link:</strong></p>
            <p id="ref-link" style="word-break: break-all; color: blue;"></p>
        </div>
        <button id="logout-btn" style="background-color: #d9534f;">Log Out</button>
    </div>

    <!-- Firebase App SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCgRGuZ7YOwa6mjqY9f7YF_DMVZ1U13sY",
            authDomain: "creators-hub-2e0fd.firebaseapp.com",
            projectId: "creators-hub-2e0fd",
            storageBucket: "creators-hub-2e0fd.firebasestorage.app",
            messagingSenderId: "829787471454",
            appId: "1:829787471454:web:fc6169591f22adbl56a7ecf",
            measurementId: "G-MNSP78BBVN"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const signupBtn = document.getElementById('signup-btn');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const refLink = document.getElementById('ref-link');

        // Sign Up
        signupBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert('Sign up successful!');
                })
                .catch((error) => {
                    alert('Error: ' + error.message);
                });
        });

        // Log In
        loginBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert('Login successful!');
                })
                .catch((error) => {
                    alert('Error: ' + error.message);
                });
        });

        // Log Out
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                alert('Logged out successfully!');
            });
        });

        // Auth State Monitor
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                refLink.innerText = `https://cooperfaye.github.io/creators-hub/?ref=${user.uid}`;
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
