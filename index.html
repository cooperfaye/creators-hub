
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creators Hub - Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
            position: relative;
        }
        h2 { margin-bottom: 20px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-signup { background-color: #7c3aed; color: white; }
        .btn-login { background-color: #222; color: white; }
        .btn-forgot { background-color: #4f46e5; color: white; }
        .btn-paypal { background-color: #0070ba; color: white; }
        .btn-stripe { background-color: #635bff; color: white; }
        .hidden { display: none; }
        .settings-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Main Auth Card -->
    <div class="card" id="authCard">
        <h2>Creators Hub</h2>
        
        <input type="text" id="fullName" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email address">
        <input type="password" id="password" placeholder="Password">
        <input type="text" id="fbGroup" placeholder="Facebook Group Link">
        
        <button class="btn-signup" onclick="handleSignUp()">Sign Up</button>
        <button class="btn-login" onclick="handleLogin()">Log In</button>
        <button class="btn-forgot" onclick="handleForgotPassword()">Forgot Password?</button>
    </div>

    <!-- Dashboard Card (Shown after login) -->
    <div class="card hidden" id="dashboardCard">
        <div class="settings-icon" onclick="openSettings()">⚙️</div>
        <h2>Welcome, <span id="displayName">User</span></h2>
        <p style="text-align: left;"><strong>Email:</strong> <span id="displayEmail"></span></p>
        <p style="text-align: left;"><strong>FB Group:</strong> <a href="#" id="displayFb" target="_blank">View Link</a></p>
        <hr style="margin: 20px 0;">
        <h3>Upgrade / Payment</h3>
        <button class="btn-paypal" onclick="alert('Redirecting to PayPal...')">Pay with PayPal</button>
        <button class="btn-stripe" onclick="alert('Redirecting to Stripe...')">Pay with Stripe</button>
        <button class="btn-login" onclick="handleLogout()" style="margin-top: 15px; background-color: #dc2626;">Log Out</button>
    </div>

    <!-- Settings Modal / View -->
    <div class="card hidden" id="settingsCard">
        <h2>Profile Settings</h2>
        <p style="text-align: left;"><strong>Name:</strong> <span id="settingsName"></span></p>
        <p style="text-align: left;"><strong>Email:</strong> <span id="settingsEmail"></span></p>
        <p style="text-align: left;"><strong>FB Group:</strong> <span id="settingsFb"></span></p>
        <button class="btn-login" onclick="closeSettings()" style="margin-top: 15px;">Back to Dashboard</button>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgRGUpFz7Y0waNmJgqYf7YF-e52054",
            authDomain: "creators-hub-2eOfd.firebaseapp.com",
            projectId: "creators-hub-2eOfd",
            storageBucket: "creators-hub-2eOfd.appspot.com",
            messagingSenderId: "829787471454",
            appId: "1:829787471454:web:e5205456d4f7fc466a7ecf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sign Up Function
        window.handleSignUp = async function() {
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fbGroup = document.getElementById('fbGroup').value;

            if (!name || !email || !password || !fbGroup) {
                alert("Please fill in all fields!");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Save user details to Firestore with status: pending
                await setDoc(doc(db, "users", user.uid), {
                    fullName: name,
                    email: email,
                    fbGroup: fbGroup,
                    status: "pending",
                    createdAt: new Date().toISOString()
                });

                alert("Account created successfully! Your account is pending admin approval.");
            } catch (error) {
                alert("Error: " + error.message);
            }
        };

        // Login Function with Admin Approval Check
        window.handleLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Please enter email and password to log in!");
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Check approval status from Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.status === "approved") {
                        // Show Dashboard & Display Name
                        document.getElementById('authCard').classList.add('hidden');
                        document.getElementById('dashboardCard').classList.remove('hidden');
                        document.getElementById('displayName').innerText = userData.fullName;
                        document.getElementById('displayEmail').innerText = userData.email;
                        document.getElementById('displayFb').innerText = userData.fbGroup;
                        document.getElementById('displayFb').href = userData.fbGroup;
                    } else {
                        alert("Your account is still pending admin approval. Please wait for activation.");
                        signOut(auth);
                    }
                } else {
                    alert("User data not found in database!");
                    signOut(auth);
                }
            } catch (error) {
                alert("Login Error: " + error.message);
            }
        };

        // Forgot Password Function
        window.handleForgotPassword = function() {
            const email = document.getElementById('email').value;
            if (!email) {
                alert("Please enter your email address in the email field first!");
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    alert("Password reset email sent! Check your inbox.");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        };

        // Settings Modal Toggle
        window.openSettings = async function() {
            const user = auth.currentUser;
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById('settingsName').innerText = data.fullName;
                    document.getElementById('settingsEmail').innerText = data.email;
                    document.getElementById('settingsFb').innerText = data.fbGroup;
                    
                    document.getElementById('dashboardCard').classList.add('hidden');
                    document.getElementById('settingsCard').classList.remove('hidden');
                }
            }
        };

        window.closeSettings = function() {
            document.getElementById('settingsCard').classList.add('hidden');
            document.getElementById('dashboardCard').classList.remove('hidden');
        };

        window.handleLogout = function() {
            signOut(auth).then(() => {
                document.getElementById('dashboardCard').classList.add('hidden');
                document.getElementById('authCard').classList.remove('hidden');
                alert("Logged out successfully.");
            });
        };
    </script>
</body>
</html>
