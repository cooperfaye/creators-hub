<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Link Creator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; margin-top: 0; text-align: center; }
        .tab-menu { display: flex; justify-content: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .tab-btn { background: #334155; color: white; border: none; padding: 8px 16px; margin: 0 5px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .tab-btn.active { background: #2563eb; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; color: #cbd5e1; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .action-btn { background: #2563eb; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .action-btn:hover { background: #1d4ed8; }
        .result-box { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #4ade80; border: 1px solid #334155; word-break: break-all; display: none; }
        a { color: #38bdf8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Dashboard & Link Creator</h2>
    
    <!-- Tab Navigation -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('authTab', this)">Sign Up / Login</button>
        <button class="tab-btn" onclick="switchTab('linkTab', this)">Link Creator</button>
    </div>

    <!-- Section 1: Sign Up / Account Creation -->
    <div id="authTab" class="form-section active">
        <label>Your Name / Username:</label>
        <input type="text" id="userName" placeholder="Enter your name...">

        <label>Email Address:</label>
        <input type="email" id="userEmail" placeholder="Enter your email...">

        <label>Password:</label>
        <input type="password" id="userPass" placeholder="Create a password...">

        <button class="action-btn" onclick="handleAccountAction()">Create Account / Sign Up</button>
        <div class="result-box" id="authResult"></div>
    </div>

    <!-- Section 2: Link Creator & Management -->
    <div id="linkTab" class="form-section">
        <label>Original Long URL (Product/Deal Link):</label>
        <input type="text" id="longUrl" placeholder="https://www.walmart.com/ip/...">

        <label>Custom Link Alias / Keyword (Optional):</label>
        <input type="text" id="customAlias" placeholder="walmart-mega-deal">

        <button class="action-btn" onclick="generateShortLink()">Generate Short Trackable Link</button>
        <div class="result-box" id="linkResult"></div>
    </div>
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function handleAccountAction() {
        const name = document.getElementById('userName').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const pass = document.getElementById('userPass').value.trim();
        const resultBox = document.getElementById('authResult');

        if(!name || !email || !pass) {
            alert('Please fill in all fields to sign up!');
            return;
        }

        resultBox.style.display = 'block';
        resultBox.innerHTML = `[Success]: Account created successfully for <b>${name} (${email})</b>!<br>[Status]: Session active and ready.`;
    }

    function generateShortLink() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const alias = document.getElementById('customAlias').value.trim() || 'deal-' + Math.floor(Math.random() * 9000 + 1000);
        const resultBox = document.getElementById('linkResult');

        if(!longUrl) {
            alert('Please enter a valid URL first!');
            return;
        }

        resultBox.style.display = 'block';
        // यहाँ हमने लिंक को डायरेक्ट क्लिक करने योग्य बना दिया है ताकि बिना किसी एरर के सीधे वॉल्मार्ट खुले
        resultBox.innerHTML = `[Generated Successfully]:<br><b>Original:</b> <a href="${longUrl}" target="_blank">${longUrl}</a><br><b>Clickable Redirect Link:</b> <a href="${longUrl}" target="_blank" style="color: #4ade80; font-size: 15px; font-weight: bold;">https://deal-hub.ly/${alias} (Click to open Walmart)</a>`;
    }
</script>

</body>
</html>
