
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Hub Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-signup { background-color: #7c3aed; color: white; }
        .btn-login { background-color: #222; color: white; }
        .btn-forgot { background-color: #4f46e5; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Creator Hub Sign Up</h2>
        
        <input type="email" id="email" placeholder="Email address">
        <input type="password" id="password" placeholder="Password">
        
        <button class="btn-signup" onclick="handleSignUp()">Sign Up</button>
        <button class="btn-login" onclick="window.location.href='login.html'">Already have an account? Log In</button>
        <button class="btn-forgot" onclick="handleForgotPassword()">Forgot Password?</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgRGUpFz7Y0waNmJgqYf7YF...",
            authDomain: "creators-hub-2eOfd.firebaseapp.com",
            projectId: "creators-hub-2eOfd",
            storageBucket: "creators-hub-2eOfd.appspot.com",
            messagingSenderId: "829787471454",
            appId: "1:829787471454:web:e5205456d4f7fc466a7ecf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleSignUp = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Please enter both email and password!");
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Account successfully created!");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        };

        window.handleForgotPassword = function() {
            const email = document.getElementById('email').value;
            if (!email) {
                alert("Please enter your email address in the email field first!");
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    alert("Password reset email sent! Check your inbox.");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        };
    </script>
</body>
</html>
