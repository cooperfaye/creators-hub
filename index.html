
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Click Deals - Affiliate Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Auth Styles */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .auth-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5a6fd6;
        }
        .switch-text {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .switch-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .switch-text a:hover {
            text-decoration: underline;
        }

        /* Dashboard Styles */
        .dashboard {
            display: none;
        }
        header {
            background: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 22px;
            color: #4a5568;
        }
        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover {
            background: #c53030;
        }
        .dashboard-content {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .stat-card h3 {
            font-size: 14px;
            color: #718096;
            margin-bottom: 5px;
        }
        .stat-card p {
            font-size: 24px;
            font-weight: bold;
            color: #2d3748;
        }
        .link-generator {
            margin-top: 20px;
        }
        .link-generator h3 {
            margin-bottom: 15px;
            color: #2d3748;
        }
        .link-box {
            display: flex;
            gap: 10px;
        }
        .link-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
        }
        .link-box button {
            padding: 10px 20px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        .link-box button:hover {
            background: #38a169;
        }
        .error-msg {
            color: #e53e3e;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- AUTH SECTION (Login / Signup) -->
    <div id="authSection" class="auth-wrapper">
        <!-- Sign Up Form -->
        <div id="signupCard" class="auth-card">
            <h2>Create Account</h2>
            <div id="signupError" class="error-msg"></div>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="signupName" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password">
            </div>
            <button class="btn" onclick="handleSignup()">Sign Up</button>
            <div class="switch-text">
                Already have an account? <a href="#" onclick="switchTab('login')">Login here</a>
            </div>
        </div>

        <!-- Login Form -->
        <div id="loginCard" class="auth-card" style="display: none;">
            <h2>Welcome Back</h2>
            <div id="loginError" class="error-msg"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="btn" onclick="handleLogin()">Login</button>
            <div class="switch-text">
                Don't have an account? <a href="#" onclick="switchTab('signup')">Sign up here</a>
            </div>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection" class="dashboard container">
        <header>
            <h1>Top Click Deals - Dashboard</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </header>
        <div class="dashboard-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Clicks</h3>
                    <p>1,245</p>
                </div>
                <div class="stat-card">
                    <h3>Active Links</h3>
                    <p>18</p>
                </div>
                <div class="stat-card">
                    <h3>Estimated Earnings</h3>
                    <p>$142.50</p>
                </div>
            </div>

            <div class="link-generator">
                <h3>Generate Affiliate Tracking Link</h3>
                <div class="link-box">
                    <input type="text" id="targetUrl" placeholder="Paste your affiliate or product URL here...">
                    <button onclick="generateLink()">Generate</button>
                </div>
                <p id="generatedResult" style="margin-top: 10px; font-weight: 600; color: #4a5568;"></p>
            </div>
        </div>
    </div>

    <script>
        // Check session on page load
        window.onload = function() {
            const loggedInUser = localStorage.getItem('tcd_logged_in_user');
            if (loggedInUser) {
                showDashboard();
            } else {
                showAuth();
            }
        };

        // Switch between Signup and Login view
        function switchTab(tab) {
            document.getElementById('signupError').innerText = '';
            document.getElementById('loginError').innerText = '';
            if (tab === 'login') {
                document.getElementById('signupCard').style.display = 'none';
                document.getElementById('loginCard').style.display = 'block';
            } else {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('signupCard').style.display = 'block';
            }
        }

        // Handle Sign Up
        function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const errorEl = document.getElementById('signupError');

            if (!name || !email || !password) {
                errorEl.innerText = 'Please fill in all fields.';
                return;
            }

            // Check if user already exists
            const existingUser = localStorage.getItem('tcd_user_' + email);
            if (existingUser) {
                errorEl.innerText = 'Email already registered. Please login.';
                return;
            }

            // Save user data
            const userData = { name, email, password };
            localStorage.setItem('tcd_user_' + email, JSON.stringify(userData));
            
            // Auto login after signup
            localStorage.setItem('tcd_logged_in_user', email);
            showDashboard();
        }

        // Handle Login
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!email || !password) {
                errorEl.innerText = 'Please fill in all fields.';
                return;
            }

            const storedUserStr = localStorage.getItem('tcd_user_' + email);
            if (!storedUserStr) {
                errorEl.innerText = 'User not found. Please sign up first.';
                return;
            }

            const storedUser = JSON.parse(storedUserStr);
            if (storedUser.password !== password) {
                errorEl.innerText = 'Incorrect password.';
                return;
            }

            // Set login session
            localStorage.setItem('tcd_logged_in_user', email);
            showDashboard();
        }

        // Handle Logout
        function handleLogout() {
            localStorage.removeItem('tcd_logged_in_user');
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            showAuth();
        }

        // Show Dashboard UI
        function showDashboard() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
        }

        // Show Auth UI
        function showAuth() {
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'flex';
            document.getElementById('signupCard').style.display = 'block';
            document.getElementById('loginCard').style.display = 'none';
        }

        // Dummy Link Generator function for testing inside dashboard
        function generateLink() {
            const url = document.getElementById('targetUrl').value.trim();
            const resultEl = document.getElementById('generatedResult');
            if (!url) {
                resultEl.innerText = 'Please enter a valid URL!';
                resultEl.style.color = '#e53e3e';
                return;
            }
            const randomCode = Math.random().toString(36).substring(2, 8);
            resultEl.innerText = `Your Tracking Link: https://topclickdeals.wordpress.com/goTo?ref=${randomCode}`;
            resultEl.style.color = '#48bb78';
        }
    </script>
</body>
</html>
