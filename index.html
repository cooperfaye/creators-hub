
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creators Hub - Dashboard & Link Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 22px;
            color: #6200ea;
        }
        .auth-btn {
            background: #6200ea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .auth-btn:hover {
            background: #3700b3;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        /* Dashboard Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #6200ea;
        }
        .stat-card h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }
        .stat-card p {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        /* Link Generator Box */
        .generator-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .generator-box h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        button.generate-btn {
            background: #6200ea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button.generate-btn:hover {
            background: #3700b3;
        }
        .result-box {
            margin-top: 15px;
            padding: 12px;
            background: #f3e8ff;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
        /* History / Links Table */
        .history-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .history-box h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header & Auth System -->
        <header>
            <h1>🚀 Creators Hub</h1>
            <button class="auth-btn" onclick="toggleAuth()" id="authBtn">Login / Sign Up</button>
        </header>

        <!-- Analytics Dashboard -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Clicks</h3>
                <p id="totalClicks">1,248</p>
            </div>
            <div class="stat-card">
                <h3>Active Links</h3>
                <p id="activeLinks">14</p>
            </div>
            <div class="stat-card">
                <h3>Total Sales / Conversions</h3>
                <p>$150.00</p>
            </div>
        </div>

        <!-- Link Generator Section -->
        <div class="generator-box">
            <h2>Link Shortener & Generator</h2>
            <input type="text" id="longUrl" placeholder="Paste your long affiliate or product link here...">
            <button class="generate-btn" onclick="generateLink()">Generate Link</button>
            <div class="result-box" id="resultBox">
                <strong>Your short link is ready:</strong><br>
                <span id="shortLinkOutput"></span>
            </div>
        </div>

        <!-- Recent Links & Analytics Table -->
        <div class="history-box">
            <h2>Recent Links & Analytics</h2>
            <table>
                <thead>
                    <tr>
                        <th>Original Link</th>
                        <th>Short Link</th>
                        <th>Clicks</th>
                    </tr>
                </thead>
                <tbody id="linkTableBody">
                    <tr>
                        <td>walmart.com/search?id=50...</td>
                        <td>#zutotf</td>
                        <td>342</td>
                    </tr>
                    <tr>
                        <td>amazon.com/dp/B08N...</td>
                        <td>#amzn90</td>
                        <td>906</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function generateLink() {
            const urlInput = document.getElementById('longUrl').value;
            if(!urlInput) {
                alert('Please enter a link first!');
                return;
            }
            
            // Generate random short code
            const randomCode = '#' + Math.random().toString(36).substring(2, 8);
            const fullShortUrl = window.location.origin + '/' + randomCode;

            // Show result box
            const resultBox = document.getElementById('resultBox');
            const shortLinkOutput = document.getElementById('shortLinkOutput');
            shortLinkOutput.innerHTML = `<a href="${fullShortUrl}" target="_blank">${fullShortUrl}</a>`;
            resultBox.style.display = 'block';

            // Add new link to table
            const tableBody = document.getElementById('linkTableBody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>${urlInput.substring(0, 30)}...</td>
                <td>${randomCode}</td>
                <td>0</td>
            `;
            tableBody.prepend(newRow);

            // Increment active links count
            let activeCount = document.getElementById('activeLinks');
            activeCount.innerText = parseInt(activeCount.innerText) + 1;
        }

        function toggleAuth() {
            const btn = document.getElementById('authBtn');
            if(btn.innerText === 'Login / Sign Up') {
                let user = prompt('Enter your name or email for login:');
                if(user) {
                    btn.innerText = 'Logout (' + user + ')';
                    alert('Successfully logged in!');
                }
            } else {
                btn.innerText = 'Login / Sign Up';
                alert('You have been logged out.');
            }
        }
    </script>
</body>
</html>
