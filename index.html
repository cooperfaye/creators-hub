
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <!-- 1. EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        // EmailJS Initialization with your Public Key
        (function() {
            emailjs.init("wOjWKKEVoYnQFQgzj");
        });
    </script>
</head>
<body>

    <div style="max-width: 400px; margin: 50px auto; padding: 20px; font-family: Arial, sans-serif;">
        <h2>Forgot Password?</h2>
        <p>Enter your email address and we will send you a password reset link.</p>
        
        <!-- 2. Password Reset Form -->
        <form id="resetForm" onsubmit="sendResetEmail(event)">
            <div style="margin-bottom: 15px;">
                <label for="userEmail">Email Address:</label><br>
                <input type="email" id="userEmail" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; cursor: pointer;">Send Reset Link</button>
        </form>
    </div>

    <!-- 3. JavaScript to handle sending email -->
    <script>
        function sendResetEmail(event) {
            event.preventDefault();
            
            const emailInput = document.getElementById('userEmail').value;
            const randomToken = Math.random().toString(36.substring(2)); // Generate a random token

            const templateParams = {
                email: emailInput,
                reset_link: `https://yourwebsite.com/reset-password.html?token=${randomToken}`
            };

            // Sending email using your Service ID and Template ID
            emailjs.send('service_90gux4a', 'template_92jkb3j', templateParams)
                .then(function(response) {
                    alert('Password reset link has been sent to your email successfully!');
                    document.getElementById('resetForm').reset();
                }, function(error) {
                    console.error('FAILED...', error);
                    alert('Failed to send email. Please try again.');
                });
        }
    </script>
</body>
</html>
