
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walmart Creator Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        .box { max-width: 600px; margin: 30px auto; background: #161f33; padding: 30px; border-radius: 10px; border: 1px solid #2a3b5c; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #2a3b5c; background: #0b0f19; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background: #0071dc; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #005bb5; }
        .hidden { display: none !important; }
        .card { background: #0b0f19; padding: 15px; margin-top: 10px; border-radius: 6px; border: 1px solid #2a3b5c; }
        .danger { background: #dc3545; }
        .success { background: #28a745; }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h2 style="color: #0071dc; text-align: center; margin-top: 0;">Walmart Creator Portal</h2>
    <p style="text-align: center; color: #8899a6; font-size: 13px;">Admin: admin@walmart.com / admin123</p>
    
    <form onsubmit="handleLogin(event)">
        <input type="email" id="loginEmail" placeholder="Email Address" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login Now</button>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
        <button onclick="quickRegister()" style="background: #28a745;">Create New Account Instantly</button>
    </div>
</div>

<div class="box hidden" id="dashboardBox">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3b5c; padding-bottom: 10px;">
        <h3 id="welcomeText" style="margin: 0; color: #0071dc;"></h3>
        <button onclick="logout()" class="danger" style="width: auto; padding: 6px 12px; margin: 0;">Logout</button>
    </div>

    <div id="partnerSection" class="hidden">
        <div class="card">
            <h4>Generate Tracking Link</h4>
            <input type="text" id="targetUrl" placeholder="Paste Walmart URL (https://www.walmart.com/...)">
            <button onclick="createLink()" class="success">Get Smart Link</button>
        </div>
        <div class="card">
            <h4>Your Generated Links</h4>
            <div id="linksList">No links yet.</div>
        </div>
    </div>

    <div id="adminSection" class="hidden">
        <div class="card">
            <h4>Admin Master Control</h4>
            <p>Total Registered Users in System:</p>
            <div id="adminUsersList">Loading...</div>
        </div>
    </div>
</div>

<script>
    // Initialize default users if not present
    function initDatabase() {
        if (!localStorage.getItem('walmart_db_users')) {
            const defaultUsers = [
                { name: "Admin Boss", email: "admin@walmart.com", pass: "admin123", role: "admin", links: [] },
                { name: "Test Creator", email: "creator@walmart.com", pass: "123456", role: "partner", links: [] }
            ];
            localStorage.setItem('walmart_db_users', JSON.stringify(defaultUsers));
        }
    }

    // Auto redirect handler for tracking clicks
    (function() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('track');
        if (code) {
            initDatabase();
            let users = JSON.parse(localStorage.getItem('walmart_db_users')) || [];
            let targetUrl = "";
            users.forEach(u => {
                if (u.links) {
                    let found = u.links.find(l => l.code === code);
                    if (found) targetUrl = found.url;
                }
            });
            window.location.replace(targetUrl ? targetUrl : "https://www.walmart.com");
        }
    })();

    function handleLogin(e) {
        e.preventDefault();
        initDatabase();
        let email = document.getElementById('loginEmail').value.trim().toLowerCase();
        let pass = document.getElementById('loginPassword').value.trim();

        let users = JSON.parse(localStorage.getItem('walmart_db_users')) || [];
        let user = users.find(u => u.email === email && u.pass === pass);

        if (user) {
            localStorage.setItem('walmart_current_user', JSON.stringify(user));
            loadDashboard();
        } else {
            alert('Wrong Email or Password! Use admin@walmart.com / admin123 or click create account.');
        }
    }

    function quickRegister() {
        initDatabase();
        let email = prompt("Enter your new email address:");
        if (!email) return;
        let pass = prompt("Enter your new password:");
        if (!pass) return;
        let name = prompt("Enter your full name:");
        if (!name) return;

        let users = JSON.parse(localStorage.getItem('walmart_db_users')) || [];
        if (users.find(u => u.email === email)) {
            alert('User already exists with this email!');
            return;
        }

        let newUser = { name, email, pass, role: "partner", links: [] };
        users.push(newUser);
        localStorage.setItem('walmart_db_users', JSON.stringify(users));
        alert('Account created successfully! Now login with your details.');
    }

    function loadDashboard() {
        let userStr = localStorage.getItem('walmart_current_user');
        if (!userStr) {
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('dashboardBox').classList.add('hidden');
            return;
        }

        let user = JSON.parse(userStr);
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboardBox').classList.remove('hidden');
        document.getElementById('welcomeText').innerText = "Welcome, " + user.name + " (" + user.role.toUpperCase() + ")";

        if (user.role === 'admin') {
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('partnerSection').classList.add('hidden');
            renderAdminPanel();
        } else {
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('partnerSection').classList.remove('hidden');
            renderPartnerPanel(user);
        }
    }

    function renderPartnerPanel(user) {
        let users = JSON.parse(localStorage.getItem('walmart_db_users')) || [];
        let current = users.find(u => u.email === user.email);
        
        let container = document.getElementById('linksList');
        if (!current.links || current.links.length === 0) {
            container.innerHTML = "No links created yet.";
            return;
        }

        container.innerHTML = current.links.map(l => `
            <div class="card">
                <small style="color: #8899a6;">Original: ${l.url}</small><br>
                <b style="color: #0071dc; word-break: break-all;">${l.tracking}</b><br>
                <button onclick="navigator.clipboard.writeText('${l.tracking}'); alert('Link Copied!');" style="margin-top: 5px; padding: 6px;">Copy Link</button>
            </div>
        `).join('');
    }

    function createLink() {
        let url = document.getElementById('targetUrl').value.trim();
        if (!url) { alert('Please enter a URL'); return; }
        if (!url.startsWith('http')) url = 'https://' + url;

        let currentUser = JSON.parse(localStorage.getItem('walmart_current_user'));
        let users = JSON.parse(localStorage.getItem('walmart_db_users')) || [];
        
        let code = Math.random().toString(36).substring(2, 8);
        let base = window.location.origin + window.location.pathname.replace('index.html', '');
        if (!base.endsWith('/')) base += '/';
        let tracking = base + "?track=" + code;

        let userIndex = users.findIndex(u => u.email === currentUser.email);
        if (userIndex !== -1) {
            if (!users[userIndex].links) users[userIndex].links = [];
            users[userIndex].links.push({ url, tracking, code });
            
            localStorage.setItem('walmart_db_users', JSON.stringify(users));
            localStorage.setItem('walmart_current_user', JSON.stringify(users[userIndex]));
            
            document.getElementById('targetUrl').value = '';
            loadDashboard();
            alert('Smart link generated successfully!');
        }
    }

    function renderAdminPanel() {
        let users = JSON.parse(localStorage.getItem('walmart_db_users')) || [];
        let container = document.getElementById('adminUsersList');
        container.innerHTML = users.map(u => `
            <div class="card">
                <b>${u.name}</b> (${u.email}) - <span style="color: #28a745;">${u.role}</span><br>
                <small style="color: #8899a6;">Links Created: ${u.links ? u.links.length : 0}</small>
            </div>
        `).join('');
    }

    function logout() {
        localStorage.removeItem('walmart_current_user');
        loadDashboard();
    }

    window.onload = function() {
        initDatabase();
        if (localStorage.getItem('walmart_current_user')) {
            loadDashboard();
        }
    }
</script>

</body>
</html>
