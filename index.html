
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walmart Creator Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        .box { max-width: 700px; margin: 30px auto; background: #161f33; padding: 30px; border-radius: 10px; border: 1px solid #2a3b5c; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #2a3b5c; background: #0b0f19; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background: #0071dc; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #005bb5; }
        .hidden { display: none !important; }
        .card { background: #0b0f19; padding: 15px; margin-top: 10px; border-radius: 6px; border: 1px solid #2a3b5c; }
        .danger { background: #dc3545; }
        .success { background: #28a745; }
        .flex { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h2 style="color: #0071dc; text-align: center; margin-top: 0;">Walmart Creator Portal</h2>
    <p style="text-align: center; color: #8899a6; font-size: 13px;">CEO Admin: admin@walmart.com / admin123</p>
    
    <form onsubmit="handleLogin(event)">
        <input type="email" id="loginEmail" placeholder="Email Address" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login to Account</button>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
        <button onclick="registerUser()" style="background: #28a745;">Register New Creator Account</button>
    </div>
</div>

<div class="box hidden" id="dashboardBox">
    <div class="flex" style="border-bottom: 1px solid #2a3b5c; padding-bottom: 10px;">
        <h3 id="welcomeText" style="margin: 0; color: #0071dc;"></h3>
        <button onclick="logout()" class="danger" style="width: auto; padding: 8px 15px; margin: 0;">Logout</button>
    </div>

    <!-- Partner Panel -->
    <div id="partnerSection" class="hidden">
        <div class="card">
            <h4>Generate Smart Tracking Link</h4>
            <input type="text" id="targetUrl" placeholder="Paste Walmart URL (https://www.walmart.com/...)">
            <button onclick="createLink()" class="success">Create Link</button>
        </div>
        <div class="card">
            <h4>Your Active Links</h4>
            <div id="linksList">No links yet.</div>
        </div>
    </div>

    <!-- CEO Admin Panel -->
    <div id="adminSection" class="hidden">
        <div class="card" style="border-color: #0071dc;">
            <h4 style="color: #0071dc; margin-top: 0;">👑 CEO Master Control Panel</h4>
            <p style="color: #8899a6; font-size: 13px;">As CEO, you can view all creators, check their performance, and delete or block any account.</p>
            <div id="adminUsersList">Loading users...</div>
        </div>
    </div>
</div>

<script>
    const ADMIN_EMAIL = "admin@walmart.com";
    const ADMIN_PASS = "admin123";

    function getDatabase() {
        let users = JSON.parse(localStorage.getItem('walmart_final_users'));
        if (!users) {
            users = [
                { name: "CEO Admin", email: ADMIN_EMAIL, pass: ADMIN_PASS, role: "admin", links: [] }
            ];
            localStorage.setItem('walmart_final_users', JSON.stringify(users));
        }
        return users;
    }

    // Direct tracking redirect handler
    (function() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('track');
        if (code) {
            let users = getDatabase();
            let targetUrl = "";
            users.forEach(u => {
                if (u.links) {
                    let found = u.links.find(l => l.code === code);
                    if (found && u.active !== false) targetUrl = found.url;
                }
            });
            window.location.replace(targetUrl ? targetUrl : "https://www.walmart.com");
        }
    })();

    function handleLogin(e) {
        e.preventDefault();
        let email = document.getElementById('loginEmail').value.trim().toLowerCase();
        let pass = document.getElementById('loginPassword').value.trim();

        let users = getDatabase();
        let user = users.find(u => u.email === email && u.pass === pass);

        if (user) {
            if (user.active === false) {
                alert('This account has been blocked by the CEO.');
                return;
            }
            localStorage.setItem('walmart_current_session', JSON.stringify(user));
            loadDashboard();
        } else {
            alert('Invalid Email or Password! Please check your credentials or register a new account.');
        }
    }

    function registerUser() {
        let name = prompt("Enter your Full Name:");
        if (!name) return;
        let email = prompt("Enter your Email Address:").trim().toLowerCase();
        if (!email) return;
        let pass = prompt("Enter your Password:");
        if (!pass) return;

        if (email === ADMIN_EMAIL) {
            alert('This email is reserved for CEO Admin.');
            return;
        }

        let users = getDatabase();
        if (users.find(u => u.email === email)) {
            alert('An account with this email already exists!');
            return;
        }

        users.push({ name, email, pass, role: "partner", active: true, links: [] });
        localStorage.setItem('walmart_final_users', JSON.stringify(users));
        alert('Account registered successfully! Now you can login.');
    }

    function loadDashboard() {
        let sessionStr = localStorage.getItem('walmart_current_session');
        if (!sessionStr) {
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('dashboardBox').classList.add('hidden');
            return;
        }

        let currentUser = JSON.parse(sessionStr);
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboardBox').classList.remove('hidden');

        if (currentUser.email === ADMIN_EMAIL) {
            document.getElementById('welcomeText').innerText = "👑 Welcome, CEO Admin";
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('partnerSection').classList.add('hidden');
            renderAdminPanel();
        } else {
            document.getElementById('welcomeText').innerText = "Welcome, " + currentUser.name;
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('partnerSection').classList.remove('hidden');
            renderPartnerPanel(currentUser.email);
        }
    }

    function renderPartnerPanel(email) {
        let users = getDatabase();
        let user = users.find(u => u.email === email);
        let container = document.getElementById('linksList');

        if (!user.links || user.links.length === 0) {
            container.innerHTML = "No links created yet.";
            return;
        }

        container.innerHTML = user.links.map(l => `
            <div class="card">
                <small style="color: #8899a6;">Target: ${l.url}</small><br>
                <b style="color: #0071dc; word-break: break-all;">${l.tracking}</b><br>
                <button onclick="navigator.clipboard.writeText('${l.tracking}'); alert('Link Copied!');" style="margin-top: 5px; padding: 6px; width:auto;">Copy Link</button>
            </div>
        `).join('');
    }

    function createLink() {
        let url = document.getElementById('targetUrl').value.trim();
        if (!url) { alert('Please enter a valid URL'); return; }
        if (!url.startsWith('http')) url = 'https://' + url;

        let sessionUser = JSON.parse(localStorage.getItem('walmart_current_session'));
        let users = getDatabase();
        let userIndex = users.findIndex(u => u.email === sessionUser.email);

        if (userIndex !== -1) {
            let code = Math.random().toString(36).substring(2, 8);
            let base = window.location.origin + window.location.pathname.replace('index.html', '');
            if (!base.endsWith('/')) base += '/';
            let tracking = base + "?track=" + code;

            if (!users[userIndex].links) users[userIndex].links = [];
            users[userIndex].links.push({ url, tracking, code });

            localStorage.setItem('walmart_final_users', JSON.stringify(users));
            localStorage.setItem('walmart_current_session', JSON.stringify(users[userIndex]));

            document.getElementById('targetUrl').value = '';
            loadDashboard();
            alert('Smart tracking link created successfully!');
        }
    }

    function renderAdminPanel() {
        let users = getDatabase();
        let container = document.getElementById('adminUsersList');
        
        let creators = users.filter(u => u.email !== ADMIN_EMAIL);
        if (creators.length === 0) {
            container.innerHTML = "No creator accounts registered yet.";
            return;
        }

        container.innerHTML = creators.map(u => `
            <div class="card flex">
                <div>
                    <b>${u.name}</b> (${u.email})<br>
                    <small style="color: #8899a6;">Links Created: ${u.links ? u.links.length : 0} | Status: <span style="color:${u.active !== false ? '#28a745' : '#dc3545'};">${u.active !== false ? 'Active' : 'Blocked'}</span></small>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button onclick="toggleUserStatus('${u.email}')" style="width: auto; padding: 6px 10px; margin: 0; background: ${u.active !== false ? '#ffc107' : '#28a745'}; color: #000;">${u.active !== false ? 'Block' : 'Unblock'}</button>
                    <button onclick="deleteUser('${u.email}')" class="danger" style="width: auto; padding: 6px 10px; margin: 0;">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function toggleUserStatus(email) {
        let users = getDatabase();
        let u = users.find(x => x.email === email);
        if (u) {
            u.active = u.active === false ? true : false;
            localStorage.setItem('walmart_final_users', JSON.stringify(users));
            renderAdminPanel();
        }
    }

    function deleteUser(email) {
        if (confirm('Are you sure you want to delete this creator account?')) {
            let users = getDatabase();
            users = users.filter(x => x.email !== email);
            localStorage.setItem('walmart_final_users', JSON.stringify(users));
            renderAdminPanel();
        }
    }

    function logout() {
        localStorage.removeItem('walmart_current_session');
        loadDashboard();
    }

    window.onload = function() {
        getDatabase();
        if (localStorage.getItem('walmart_current_session')) {
            loadDashboard();
        }
    }
</script>

</body>
</html>
