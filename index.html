
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate & Payout Dashboard Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; margin-top: 0; text-align: center; }
        .tab-menu { display: flex; justify-content: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; flex-wrap: wrap; gap: 5px; }
        .tab-btn { background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .tab-btn.active { background: #2563eb; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; color: #cbd5e1; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .action-btn { background: #2563eb; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .action-btn:hover { background: #1d4ed8; }
        .result-box { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #4ade80; border: 1px solid #334155; word-break: break-all; }
        .card { background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #334155; text-align: center; }
        .balance { font-size: 24px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Affiliate & Payout Hub</h2>
    
    <!-- Tab Navigation -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('authTab', this)">Account</button>
        <button class="tab-btn" onclick="switchTab('linkTab', this)">Link Creator</button>
        <button class="tab-btn" onclick="switchTab('payoutTab', this)">Payouts</button>
    </div>

    <!-- Section 1: Sign Up / Login -->
    <div id="authTab" class="form-section active">
        <label>Your Name / Username:</label>
        <input type="text" id="userName" value="Prem Chand" placeholder="Enter your name...">

        <label>Email Address:</label>
        <input type="email" id="userEmail" value="premchand601@gmail.com" placeholder="Enter your email...">

        <label>Password:</label>
        <input type="password" id="userPass" value="********" placeholder="Create a password...">

        <button class="action-btn" onclick="handleAccountAction()">Save & Login</button>
        <div class="result-box" id="authResult" style="display:none;"></div>
    </div>

    <!-- Section 2: Link Creator -->
    <div id="linkTab" class="form-section">
        <label>Original Long URL (Product/Deal Link):</label>
        <input type="text" id="longUrl" placeholder="https://www.walmart.com/ip/example">

        <label>Custom Link Alias (Optional):</label>
        <input type="text" id="customAlias" placeholder="walmart-deal">

        <button class="action-btn" onclick="generateShortLink()">Generate Short Link</button>
        <div class="result-box" id="linkResult" style="display:none;"></div>
    </div>

    <!-- Section 3: Payout System -->
    <div id="payoutTab" class="form-section">
        <div class="card">
            <div style="font-size: 13px; color: #94a3b8;">Available Balance</div>
            <div class="balance" id="walletBalance">$1,250.00</div>
        </div>

        <label>Select Payout Method:</label>
        <input type="text" value="PayPal / Bank Transfer" readonly>

        <button class="action-btn" style="background: #059669;" onclick="requestPayout()">Request Payout</button>
        <div class="result-box" id="payoutResult" style="display:none;"></div>
    </div>
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function handleAccountAction() {
        const name = document.getElementById('userName').value.trim();
        const resultBox = document.getElementById('authResult');
        resultBox.style.display = 'block';
        resultBox.innerHTML = `[Success]: Welcome back, <b>${name}</b>! Session active.`;
    }

    function generateShortLink() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const alias = document.getElementById('customAlias').value.trim() || 'deal-' + Math.floor(Math.random()*1000);
        const resultBox = document.getElementById('linkResult');

        if(!longUrl) {
            alert('Please enter a URL first!');
            return;
        }

        resultBox.style.display = 'block';
        resultBox.innerHTML = `[Generated]:<br><span style="color: #38bdf8;">https://deal-hub.ly/${alias}</span>`;
    }

    function requestPayout() {
        const resultBox = document.getElementById('payoutResult');
        resultBox.style.display = 'block';
        resultBox.innerHTML = `[Processing]: Payout request of $1,250.00 submitted successfully!`;
    }
</script>

</body>
</html>
