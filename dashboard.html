<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO Admin & Creator Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .header h2 {
            color: #38bdf8;
            font-size: 22px;
        }
        .back-btn {
            background: #334155;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #475569;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .card h3 {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .card .value {
            font-size: 26px;
            font-weight: bold;
            color: #f1f5f9;
        }
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        .table-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        th {
            color: #94a3b8;
        }
        .action-btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
        }
        .block-btn {
            background: #ef4444;
            color: white;
        }
        .hold-btn {
            background: #f59e0b;
            color: white;
        }
        .action-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛡️ CEO Master Control Panel</h2>
        <a href="index.html" class="back-btn">← Home</a>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Total Platform Traffic</h3>
            <div class="value">45,890</div>
        </div>
        <div class="card">
            <h3>Active Users / Creators</h3>
            <div class="value">1,240</div>
        </div>
        <div class="card">
            <h3>Pending Payouts</h3>
            <div class="value">$12,450</div>
        </div>
    </div>

    <div class="table-container">
        <div class="section-title">User & Payout Master Controls</div>
        <table>
            <thead>
                <tr>
                    <th>User / Creator</th>
                    <th>Clicks / Traffic</th>
                    <th>Earnings</th>
                    <th>Admin Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Rahul Deals</td>
                    <td>14,200</td>
                    <td>$4,120</td>
                    <td>
                        <button class="action-btn block-btn" onclick="alert('User Blocked!')">Block User</button>
                        <button class="action-btn hold-btn" onclick="alert('Payout Held!')">Hold Payout</button>
                    </td>
                </tr>
                <tr>
                    <td>Priya Offers</td>
                    <td>9,800</td>
                    <td>$2,850</td>
                    <td>
                        <button class="action-btn block-btn" onclick="alert('User Blocked!')">Block User</button>
                        <button class="action-btn hold-btn" onclick="alert('Payout Held!')">Hold Payout</button>
                    </td>
                </tr>
                <tr>
                    <td>Amit Promo</td>
                    <td>21,890</td>
                    <td>$5,480</td>
                    <td>
                        <button class="action-btn block-btn" onclick="alert('User Blocked!')">Block User</button>
                        <button class="action-btn hold-btn" onclick="alert('Payout Held!')">Hold Payout</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
